[project]
name = "repoview"
version = "1.4"
description = "用浏览器阅读 Markdown / 代码 / PDF：localview 看本地目录，ghview 看 GitHub 仓库，共用 viewcore 渲染"
requires-python = ">=3.9"
dependencies = [
    "markdown-it-py>=3.0",
    "mdit-py-plugins>=0.4",
    "pygments>=2.17",
    "pymupdf>=1.24,<2",  # 2.x 会连带装 onnxruntime 等大包，用不上
]

[tool.uv]
package = false
